[package]
name = "glyph"
version = "0.1.0"
edition = "2021"
authors = ["Rick Walker <xuoxod@gmail.com>"]
description = "Sovereign, ultra-fast emoji & symbol engine on demand for consoles, SSH sessions, and scripts"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xuoxod/glyph"
readme = "README.md"
keywords = ["emoji", "cli", "terminal", "ssh", "osc52"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = { version = "0.28", default-features = false, features = ["events"] }
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
